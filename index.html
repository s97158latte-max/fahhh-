<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="fahhh!">
    <meta name="theme-color" content="#ffffff">
    <title>fahhh!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap"></noscript>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dock.css">
    <link rel="stylesheet" href="css/characters.css">
</head>
<body>
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <symbol id="wj" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="16" fill="#fff" stroke="#000" stroke-width="2.5" />
                <path d="M8 13l8 3M32 13l-8 3" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" />
                <circle cx="14" cy="20" r="2.2" fill="#000" />
                <circle cx="26" cy="20" r="2.2" fill="#000" />
                <path d="M13 24q-3 6 0 12M27 24q3 6 0 12" stroke="#00A2E8" stroke-width="2.5" fill="none"
                    stroke-linecap="round" />
                <path d="M13 32q7-8 14 0" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round" />
            </symbol>
        </defs>
    </svg>

    <div class="hd">
        <h1>fahhh! <svg width="52" height="52">
                <use href="#wj" />
            </svg></h1>
        <p class="sub">迷因總資料庫。勾選「裝備」，右下角的小白點就會長出那顆按鈕 (╥﹏╥)</p>
        <p class="sub">沒聲音？先檢查 iPhone 側邊的靜音鍵和音量</p>
        <img class="wj" id="wjB" alt="" aria-hidden="true" draggable="false" src="images/wjB.png" width="377" height="582" decoding="async">
    </div>
    <div class="note">(;´Д`) 音檔只存在這個瀏覽器；iPhone 的「主畫面 App」和 Safari 各自獨立，加入主畫面後要重新上傳。</div>
    <button class="btn" id="up">＋ 上傳新迷因</button>
    <div id="upMsg" role="status" aria-live="polite" hidden></div>
    <input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac" multiple hidden>
    <div id="list"></div>

    <div class="ft"><img class="wj" id="wjA" alt="" aria-hidden="true" draggable="false" src="images/wjA.png" width="318" height="582" loading="lazy" decoding="async"></div>
    <div id="credit"><span>created by</span><img alt="邊境部署 EdgeDeploy" draggable="false" src="images/edgedeploy-horizontal-blue.png" width="2400" height="597" decoding="async">
    </div>
    <div id="bd"></div>
    <div id="dock">
        <div id="empty">還沒有裝備任何迷因 😭<br>去資料庫勾選！</div>
        <div id="more" role="status"></div>
        <div id="ring"></div>
        <button class="btn" id="fab" aria-label="迷因快捷選單"><svg width="48" height="48">
                <use href="#wj" />
            </svg></button>
    </div>

    <script src="js/util.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/list.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/upload.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
